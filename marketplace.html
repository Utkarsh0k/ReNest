<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Marketplace | ReNest</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/marketplace.css">

</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Marketplace -->

    <section class="marketplace">

        <div class="marketplace-header">

    <div>

        <p class="page-tag">
            MARKETPLACE
        </p>

        <h1>
            Discover Student Deals
        </h1>

        <p class="page-description">

            Buy books, gadgets, furniture and everyday essentials directly from students around your campus.

        </p>
        
<div class="market-highlights">

    <span>✓ Verified Students</span>

    <span>✓ Safe Campus Deals</span>

    <span>✓ No Platform Fees</span>

</div>
    </div>

</div>

        <div class="market-toolbar">

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search books, laptops, furniture...">

    </div>

    <a
        href="sell.html"
        class="primary">

        + Sell Item

    </a>

</div>

<div class="category-pills">

    <button class="pill active" data-category="All">All</button>

    <button class="pill" data-category="Books">Books</button>

    <button class="pill" data-category="Electronics">Electronics</button>

    <button class="pill" data-category="Furniture">Furniture</button>

    <button class="pill" data-category="Cycles">Cycles</button>

    <button class="pill" data-category="Accessories">Accessories</button>

</div>

<div class="listing-bar">

    <p id="listingCount">

        0 Products

    </p>

    <select id="sortSelect">

        <option value="latest">

            Latest

        </option>

        <option value="low">

            Price: Low to High

        </option>

        <option value="high">

            Price: High to Low

        </option>

    </select>

</div>

        <div
            id="productContainer"
            class="product-grid">

        </div>

    </section>

    <!-- Toast -->

    <div id="toast"></div>

    <!-- Scripts -->

    <script src="js/script.js"></script>

    <script src="js/navbar.js"></script>

    <script src="js/authGuard.js"></script>

    <script src="js/marketplace.js"></script>

</body>

</html>
